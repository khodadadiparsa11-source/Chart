<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>چارت حجم — زیر یک دقیقه</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="چارت">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#222b36; --grid:#1a212b;
    --text:#e6edf3; --dim:#8b949e;
    --up:#0bb07b; --down:#e5484d; --hot:#ff9f0a; --accent:#3b82f6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; overscroll-behavior:none}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:Vazirmatn,system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  select,button{
    font-family:inherit; font-size:13px; color:var(--text);
    background:#1c2330; border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; min-height:36px;
  }
  button{cursor:pointer}
  button.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .tfs{display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; flex:1 1 100%}
  .tfs button{padding:6px 11px; white-space:nowrap}
  .stats{
    display:flex; gap:14px; flex-wrap:wrap; align-items:baseline;
    padding:7px 12px; background:var(--panel); border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums; flex:0 0 auto; min-height:34px;
  }
  .stat{display:flex; gap:5px; align-items:baseline; font-size:12px}
  .stat b{font-size:14px; font-weight:600}
  .k{color:var(--dim)}
  #price b{font-size:17px}
  .up{color:var(--up)} .down{color:var(--down)} .hot{color:var(--hot)}
  #wrap{flex:1 1 auto; min-height:0; position:relative; touch-action:none}
  canvas{display:block; width:100%; height:100%}
  #msg{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:rgba(14,17,22,.94); z-index:5;
  }
  #msg div{max-width:340px; line-height:1.9; font-size:13px}
  #msg b{display:block; margin-bottom:8px; font-size:15px}
  #msg .dim{color:var(--dim)}
  footer{
    padding:5px 12px; font-size:11px; color:var(--dim); background:var(--panel);
    border-top:1px solid var(--line); flex:0 0 auto; display:flex;
    justify-content:space-between; gap:10px;
  }
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--dim); margin-left:5px}
  .dot.live{background:var(--up)} .dot.bad{background:var(--down)}
</style>
</head>
<body>

<header>
  <select id="sym">
    <option value="BTCUSDT">بیت‌کوین — BTCUSDT</option>
    <option value="ETHUSDT">اتریوم — ETHUSDT</option>
    <option value="PAXGUSDT">طلا (توکن) — PAXGUSDT</option>
    <option value="SOLUSDT">سولانا — SOLUSDT</option>
    <option value="XRPUSDT">ریپل — XRPUSDT</option>
  </select>
  <button id="hotBtn" class="on">هایلایت حجم</button>
  <button id="dBtn" class="on">دلتا</button>
  <button id="fpBtn" class="on">فوت‌پرینت</button>
  <button id="absBtn" class="on">جذب</button>
  <button id="lineBtn">خط</button>
  <button id="homeBtn">آخرین</button>
  <div class="tfs" id="tfs"></div>
</header>

<div class="stats">
  <div class="stat" id="price"><span class="k">قیمت</span><b>—</b></div>
  <div class="stat"><span class="k">تغییر</span><b id="chg">—</b></div>
  <div class="stat"><span class="k">RVOL</span><b id="rvol">—</b></div>
  <div class="stat"><span class="k">حجم</span><b id="cvol">—</b></div>
  <div class="stat"><span class="k">دلتا</span><b id="dlt">—</b></div>
</div>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="msg"><div></div></div>
</div>

<footer>
  <span>بایننس — حجم واقعی <span id="dot" class="dot"></span><span id="state">…</span></span>
  <span><span id="tfNote"></span> <span style="opacity:.55">v8 · جذب</span></span>
</footer>

<script>
'use strict';
// Everything is drawn here rather than pulled from a charting library. One less
// external host to reach is worth the extra code on a restricted connection:
// the only thing this page needs from the network now is Binance itself.

// Binance publishes 1-second klines and nothing between that and a minute, so
// 5s / 15s / 30s are folded from the 1s stream in the browser.
const TFS = [
  {id:'1s',  label:'۱ ثانیه',  base:'1s',  fold:1},
  {id:'5s',  label:'۵ ثانیه',  base:'1s',  fold:5},
  {id:'15s', label:'۱۵ ثانیه', base:'1s',  fold:15},
  {id:'30s', label:'۳۰ ثانیه', base:'1s',  fold:30},
  {id:'1m',  label:'۱ دقیقه',  base:'1m',  fold:1},
  {id:'5m',  label:'۵ دقیقه',  base:'5m',  fold:1},
  {id:'15m', label:'۱۵ دقیقه', base:'15m', fold:1},
];
const HOSTS = ['https://data-api.binance.vision','https://api.binance.com',
               'https://api1.binance.com','https://api2.binance.com'];
const WS_HOSTS = ['wss://data-stream.binance.vision:9443/ws','wss://stream.binance.com:9443/ws'];

const RVOL_LOOKBACK = 50, HOT_MULT = 2.0;
const PAD_R = 58, PAD_B = 20, PAD_T = 8, VOL_FRAC = 0.26;

let tf = TFS[0], symbol = 'BTCUSDT', highlight = true;
let bars = [], ws = null, hostIdx = 0, wsIdx = 0, reconnect = null;
let view = {count:120, right:0};      // right = bars hidden past the right edge
let cross = null, follow = true;
let deltaOn = true, fpOn = true, lineMode = false, absOn = true;

// Absorption: heavy volume whose aggressor disagrees with where the candle
// closed. Price rose while selling dominated means someone large was filling
// the other way behind the move. These thresholds keep it to real imbalances —
// without the second one, every candle with a slightly negative delta boxes.
const ABS_VOL   = 1.8;    // times the recent normal volume
const ABS_RATIO = 0.15;   // |delta| as a share of the candle's traded volume
let crossY = null, levels = [];
let vel = 0, glide = null;
let scale = {hi:1, lo:0, priceH:1, plotH:1, plotW:1, bw:1, start:0, end:0};
const priceAt = py => scale.hi - (py - PAD_T)/scale.priceH * (scale.hi - scale.lo);

// What the chart looked like last time. A tool that forgets which symbol you
// were on is a tool you reconfigure instead of read.
const SKEY = 'chart.prefs.v1';
function savePrefs(){
  try{ localStorage.setItem(SKEY, JSON.stringify(
    {symbol, tf:tf.id, highlight, deltaOn, fpOn, absOn, count:Math.round(view.count)})); }catch(e){}
}
function loadPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem(SKEY) || '{}');
    if (p.symbol) symbol = p.symbol;
    const t = TFS.find(x => x.id === p.tf); if (t) tf = t;
    if (typeof p.highlight === 'boolean') highlight = p.highlight;
    if (typeof p.deltaOn === 'boolean') deltaOn = p.deltaOn;
    if (typeof p.fpOn === 'boolean') fpOn = p.fpOn;
    if (typeof p.absOn === 'boolean') absOn = p.absOn;
    if (p.count) view.count = p.count;
  }catch(e){}
}
const LKEY = () => 'chart.levels.' + symbol;
function loadLevels(){
  try{ levels = JSON.parse(localStorage.getItem(LKEY()) || '[]'); }catch(e){ levels = []; }
}
function saveLevels(){ try{ localStorage.setItem(LKEY(), JSON.stringify(levels)); }catch(e){} }

// Real order flow. Binance flags every trade with which side was the aggressor,
// so buying and selling are counted rather than guessed from candle colour the
// way every other tool here has had to. Keyed by the bar's bucket time.
let flow = new Map();      // time -> {buy, sell, lv:Map(priceLevel -> {b,s})}  exact
// Downloading every trade behind fifty five-minute candles means half a million
// records and hundreds of requests, which a browser will not do. One-second
// klines cover the same ground in a handful of requests: a price and a volume
// for every second, with the side inferred from that second's direction. Less
// precise than counting aggressors, far better than an empty chart — and the
// exact figures overwrite it wherever real trades exist.
let approx = new Map();
let approxKey = '', approxBusy = false;
let tws = null, twsTimer = null, lvlTick = 1;

function barSeconds(){
  if (tf.base === '1s')  return tf.fold;   // 1, 5, 15 or 30
  if (tf.base === '1m')  return 60;
  if (tf.base === '5m')  return 300;
  if (tf.base === '15m') return 900;
  return tf.fold;
}
const tradeBucket = sec => Math.floor(sec/barSeconds()) * barSeconds();

function niceStep(x){
  if (!(x > 0)) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(x))), n = x/mag;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * mag;
}

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;

const fmt = (n,d=2) => n==null||!isFinite(n) ? '—'
  : n.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
const shortVol = v => v>=1e6 ? (v/1e6).toFixed(2)+'M' : v>=1e3 ? (v/1e3).toFixed(1)+'K' : fmt(v,2);
const digits = () => { const p = bars.length ? bars[bars.length-1].close : 0;
  return p>=1000 ? 2 : p>=1 ? 3 : 6; };

function say(t,b){ const m=$('msg'); m.style.display='flex';
  m.firstElementChild.innerHTML = '<b>'+t+'</b><span class="dim">'+b+'</span>'; }
function hideMsg(){ $('msg').style.display='none'; }
function state(t,c){ $('state').textContent=t; $('dot').className='dot'+(c?' '+c:''); }

// ─── Canvas sizing ──────────────────────────────────────────────────────────
function resize(){
  const r = $('wrap').getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  render();
}
new ResizeObserver(resize).observe($('wrap'));

// ─── Volume readings ────────────────────────────────────────────────────────
function normalVolume(i){
  const from = Math.max(0, i-RVOL_LOOKBACK), n = i-from;
  if (n <= 0) return null;
  let s = 0; for (let k=from;k<i;k++) s += bars[k].volume;
  return s/n;
}
function isHot(i){
  const nv = normalVolume(i);
  return highlight && nv && bars[i].volume >= nv*HOT_MULT;
}

// ─── Drawing ────────────────────────────────────────────────────────────────
function visible(){
  const end = Math.max(1, bars.length - view.right);
  const start = Math.max(0, end - view.count);
  return {start, end};
}
function render(){
  ctx.clearRect(0,0,W,H);
  if (!bars.length || W<40 || H<60) return;

  const {start,end} = visible();
  const n = end-start;
  if (n <= 0) return;

  const plotW = W - PAD_R, plotH = H - PAD_B;
  const volH = plotH * VOL_FRAC, priceH = plotH - volH - PAD_T;
  const bw = plotW / view.count;

  let lo = Infinity, hi = -Infinity, mv = 0;
  for (let i=start;i<end;i++){
    const b = bars[i];
    if (b.low  < lo) lo = b.low;
    if (b.high > hi) hi = b.high;
    if (b.volume > mv) mv = b.volume;
  }
  if (!isFinite(lo) || hi === lo){ hi = lo + 1; lo -= 1; }
  const pad = (hi-lo)*0.06; hi += pad; lo -= pad;

  // The page is RTL but a price chart is not: newest stays on the right.
  scale = {hi, lo, priceH, plotH, plotW, bw, start, end};
  const x = i => plotW - (end - i) * bw + bw/2;
  const y = p => PAD_T + (hi-p)/(hi-lo) * priceH;
  const vy = v => plotH - (mv ? v/mv : 0) * volH;

  // grid + price axis
  ctx.font = '10px Vazirmatn, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#1a212b';
  ctx.fillStyle = '#8b949e';
  ctx.lineWidth = 1;
  const steps = Math.max(2, Math.min(6, Math.floor(priceH/46)));
  for (let k=0;k<=steps;k++){
    const p = lo + (hi-lo)*k/steps, py = Math.round(y(p))+0.5;
    ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(plotW,py); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillText(fmt(p, digits()), plotW+6, py);
  }

  // Footprint is computed before the candles are drawn, because a bar that has
  // one is drawn as an outline: filled bodies bury the cells underneath them,
  // which is what made this unreadable.
  const body = Math.max(1, Math.min(bw*0.72, bw-1));
  let fpRows = null, fpMax = 0, dispTick = 0, cellH = 0;
  if (fpOn && bw >= 9){
    dispTick = Math.max(lvlTick, niceStep((hi-lo)/26));
    fpRows = new Map();
    for (let i=start;i<end;i++){
      const e = flow.get(bars[i].time) || approx.get(bars[i].time);
      if (!e || !e.lv.size) continue;
      const g = new Map();
      for (const [L, c] of e.lv){
        const k = Math.floor(L/dispTick)*dispTick;
        let z = g.get(k);
        if (!z){ z = {b:0, s:0}; g.set(k, z); }
        z.b += c.b; z.s += c.s;
        const t = z.b + z.s;
        if (t > fpMax) fpMax = t;
      }
      fpRows.set(i, g);
    }
    if (!fpRows.size || fpMax <= 0) fpRows = null;
    else cellH = Math.max(2, Math.abs(y(0) - y(dispTick)) - 1);
  }

  // candles
  for (let i=start;i<end;i++){
    const bb = bars[i], cx = x(i), up = bb.close >= bb.open;
    const col = up ? '#0bb07b' : '#e5484d';
    ctx.strokeStyle = col;
    ctx.beginPath();
    ctx.moveTo(Math.round(cx)+0.5, y(bb.high));
    ctx.lineTo(Math.round(cx)+0.5, y(bb.low));
    ctx.stroke();
    const yo = y(bb.open), yc = y(bb.close);
    const top = Math.min(yo,yc), h = Math.max(1, Math.abs(yc-yo));
    if (fpRows && fpRows.has(i)){
      ctx.lineWidth = 1;
      ctx.strokeRect(Math.round(cx-body/2)+0.5, Math.round(top)+0.5, Math.round(body), Math.round(h));
    } else {
      ctx.fillStyle = col;
      ctx.fillRect(cx-body/2, top, body, h);
    }
  }

  // Footprint cells: selling grows left of the candle's centre, buying right,
  // so the imbalance at a price reads as a shape rather than a shade.
  if (fpRows){
    const half = body/2;
    const showNums = bw >= 54 && cellH >= 9;
    ctx.font = Math.min(10, Math.max(7, cellH-2)) + 'px Vazirmatn, sans-serif';
    ctx.textBaseline = 'middle';
    for (const [i, g] of fpRows){
      const cx = x(i);
      for (const [L, c] of g){
        const t = c.b + c.s;
        if (!t) continue;
        const yTop = y(L + dispTick);
        if (yTop < -cellH || yTop > priceH + PAD_T) continue;
        const share = Math.min(1, t/fpMax);
        const ws = half * (c.s/t) * share, wb = half * (c.b/t) * share;
        if (ws > 0.4){
          ctx.fillStyle = 'rgba(229,72,77,' + (0.4 + 0.5*share).toFixed(2) + ')';
          ctx.fillRect(cx - ws, yTop, ws, cellH);
        }
        if (wb > 0.4){
          ctx.fillStyle = 'rgba(11,176,123,' + (0.4 + 0.5*share).toFixed(2) + ')';
          ctx.fillRect(cx, yTop, wb, cellH);
        }
        if (showNums){
          ctx.fillStyle = 'rgba(230,237,243,.9)';
          ctx.textAlign = 'right'; ctx.fillText(shortVol(c.s), cx - 2, yTop + cellH/2);
          ctx.textAlign = 'left';  ctx.fillText(shortVol(c.b), cx + 2, yTop + cellH/2);
        }
      }
    }
    ctx.textAlign = 'center';
  }

  // volume, tinted by real delta where the flow is known
  for (let i=start;i<end;i++){
    const bb = bars[i], cx = x(i), e = flow.get(bb.time) || approx.get(bb.time);
    let col;
    if (isHot(i)) col = '#ff9f0a';
    else if (deltaOn && e && (e.buy || e.sell))
      col = e.buy >= e.sell ? 'rgba(11,176,123,.6)' : 'rgba(229,72,77,.6)';
    else col = bb.close >= bb.open ? 'rgba(11,176,123,.35)' : 'rgba(229,72,77,.35)';
    ctx.fillStyle = col;
    const vt = vy(bb.volume);
    ctx.fillRect(cx-body/2, vt, body, plotH-vt);
  }

  // last price marker
  const last = bars[end-1], ly = y(last.close);
  if (ly > 0 && ly < plotH){
    ctx.setLineDash([3,3]);
    ctx.strokeStyle = '#3b82f6';
    ctx.beginPath(); ctx.moveTo(0, Math.round(ly)+0.5); ctx.lineTo(plotW, Math.round(ly)+0.5); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(plotW, ly-8, PAD_R, 16);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText(fmt(last.close, digits()), plotW+5, ly);
  }

  // time axis
  ctx.fillStyle = '#8b949e'; ctx.textAlign = 'center';
  const every = Math.max(1, Math.ceil(74/bw));
  for (let i=start+((n-1)%every);i<end;i+=every){
    const d = new Date(bars[i].time*1000);
    const lbl = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
              + (tf.fold<60 && tf.base==='1s' ? ':'+String(d.getSeconds()).padStart(2,'0') : '');
    ctx.fillText(lbl, x(i), plotH+10);
  }

  // crosshair
  // Absorption boxes. The border is solid where the flow was counted from real
  // trades and dashed where it was estimated from one-second candles, because
  // the two are not equally strong evidence and should not look alike.
  if (absOn){
    for (let i=start;i<end;i++){
      const b2 = bars[i];
      const exact = flow.has(b2.time);
      const e = flow.get(b2.time) || approx.get(b2.time);
      if (!e) continue;
      const traded = e.buy + e.sell;
      if (!traded) continue;
      const nv = normalVolume(i);
      if (!nv || b2.volume < nv * ABS_VOL) continue;
      const d = e.buy - e.sell;
      if (Math.abs(d)/traded < ABS_RATIO) continue;
      const rose = b2.close > b2.open, fell = b2.close < b2.open;
      if (!((rose && d < 0) || (fell && d > 0))) continue;

      const cx = x(i);
      const yTop = y(b2.high), yBot = y(b2.low);
      const col = rose ? '#e5484d' : '#0bb07b';   // the side that was hidden
      ctx.strokeStyle = col;
      ctx.lineWidth = exact ? 1.6 : 1;
      ctx.setLineDash(exact ? [] : [3,3]);
      const bx0 = cx - body/2 - 3, bw2 = body + 6;
      ctx.strokeRect(Math.round(bx0)+0.5, Math.round(yTop)-3.5,
                     Math.round(bw2), Math.round(yBot-yTop)+7);
      ctx.setLineDash([]);
      ctx.lineWidth = 1;
      ctx.fillStyle = (rose ? 'rgba(229,72,77,' : 'rgba(11,176,123,') + '0.07)';
      ctx.fillRect(bx0, yTop-3, bw2, (yBot-yTop)+7);
    }
  }

  // saved levels
  for (const L of levels){
    const ly2 = y(L);
    if (ly2 < 0 || ly2 > plotH) continue;
    ctx.strokeStyle = 'rgba(255,159,10,.85)';
    ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(0, Math.round(ly2)+0.5); ctx.lineTo(plotW, Math.round(ly2)+0.5); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,159,10,.9)';
    ctx.fillRect(plotW, ly2-7, PAD_R, 14);
    ctx.fillStyle = '#0e1116'; ctx.textAlign = 'left';
    ctx.fillText(fmt(L, digits()), plotW+5, ly2);
  }

  if (fpOn){
    const need = bw < 9 && (flow.size || approx.size);
    $('fpBtn').textContent = need ? 'فوت‌پرینت ⤢' : 'فوت‌پرینت';
    let exact = 0;
    for (let i=start;i<end;i++) if (flow.has(bars[i].time)) exact++;
    $('tfNote').textContent = exact
      ? exact + ' کندل دقیق از ' + n
      : (tf.fold > 1 ? 'ساخته‌شده از کندل ۱ ثانیه‌ای' : '');
  } else $('fpBtn').textContent = 'فوت‌پرینت';

  // crosshair, with the value it is pointing at written on each axis
  if (cross != null && cross >= start && cross < end){
    const cx = x(cross);
    ctx.strokeStyle = 'rgba(139,148,158,.6)';
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(Math.round(cx)+0.5, 0); ctx.lineTo(Math.round(cx)+0.5, plotH); ctx.stroke();
    if (crossY != null && crossY < plotH){
      ctx.beginPath(); ctx.moveTo(0, Math.round(crossY)+0.5); ctx.lineTo(plotW, Math.round(crossY)+0.5); ctx.stroke();
    }
    ctx.setLineDash([]);

    if (crossY != null && crossY < priceH + PAD_T){
      const pv = hi - (crossY - PAD_T)/priceH * (hi-lo);
      ctx.fillStyle = '#2b3440';
      ctx.fillRect(plotW, crossY-8, PAD_R, 16);
      ctx.fillStyle = '#e6edf3'; ctx.textAlign = 'left';
      ctx.fillText(fmt(pv, digits()), plotW+5, crossY);
    }
    const d = new Date(bars[cross].time*1000);
    const lbl = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
              + (tf.base==='1s' ? ':'+String(d.getSeconds()).padStart(2,'0') : '');
    ctx.textAlign = 'center';
    const tw = ctx.measureText(lbl).width + 10;
    ctx.fillStyle = '#2b3440';
    ctx.fillRect(Math.min(Math.max(cx-tw/2, 0), plotW-tw), plotH+1, tw, PAD_B-2);
    ctx.fillStyle = '#e6edf3';
    ctx.fillText(lbl, Math.min(Math.max(cx, tw/2), plotW-tw/2), plotH+10);
  }
}

// ─── Stats readout ──────────────────────────────────────────────────────────
function showStats(i){
  const b = bars[i]; if (!b) return;
  const nv = normalVolume(i), rv = nv ? b.volume/nv : null, up = b.close >= b.open;
  $('price').innerHTML = '<span class="k">قیمت</span><b class="'+(up?'up':'down')+'">'+fmt(b.close,digits())+'</b>';
  const pct = (b.close-b.open)/b.open*100;
  $('chg').textContent = (pct>=0?'+':'')+pct.toFixed(3)+'٪';
  $('chg').className = pct>=0 ? 'up' : 'down';
  $('rvol').textContent = rv ? rv.toFixed(2)+'x' : '—';
  $('rvol').className = rv && rv>=HOT_MULT ? 'hot' : '';
  $('cvol').textContent = shortVol(b.volume);
  const e = flow.get(b.time) || approx.get(b.time);
  if (e && (e.buy || e.sell)){
    const d = e.buy - e.sell;
    $('dlt').textContent = (d >= 0 ? '+' : '') + shortVol(Math.abs(d)).replace('-','');
    $('dlt').className = d >= 0 ? 'up' : 'down';
  } else {
    $('dlt').textContent = '—';
    $('dlt').className = '';
  }
}
function statsForCursor(){ showStats(cross != null ? cross : bars.length-1); }

// ─── Touch and mouse ────────────────────────────────────────────────────────
let drag = null, pinch = null, lastTap = 0;
function barAt(px){
  const {start,end} = visible(), plotW = W - PAD_R, bw = plotW/view.count;
  const i = end - Math.ceil((plotW - px)/bw);
  return Math.max(start, Math.min(end-1, i));
}
function clampView(){
  view.count = Math.max(6, Math.min(600, Math.round(view.count)));
  view.right = Math.max(0, Math.min(Math.max(0, bars.length-6), Math.round(view.right)));
  follow = view.right === 0;
}

// After a flick the chart keeps moving and settles, the way a scroll view does.
// Without it every pan stops dead the instant the finger lifts, which is the
// single thing that makes a homemade chart feel homemade.
let approxTimer = null;
function scheduleApprox(){ clearTimeout(approxTimer); approxTimer = setTimeout(fillApprox, 350); }
function stopGlide(){ if (glide){ cancelAnimationFrame(glide); glide = null; } }
function startGlide(){
  stopGlide();
  const step = () => {
    vel *= 0.94;
    if (Math.abs(vel) < 0.02){ glide = null; return; }
    const bw = (W-PAD_R)/view.count;
    view.right += vel/bw;
    clampView();
    render();
    glide = requestAnimationFrame(step);
  };
  glide = requestAnimationFrame(step);
}

function toggleLevelAt(py){
  const p = priceAt(py);
  const tolP = (scale.hi-scale.lo) * 8 / Math.max(1, scale.priceH);
  const near = levels.findIndex(L => Math.abs(L-p) <= tolP);
  if (near >= 0) levels.splice(near, 1);
  else levels.push(+p.toFixed(digits()));
  saveLevels(); render();
}

$('wrap').addEventListener('touchstart', e => {
  stopGlide();
  const r = cv.getBoundingClientRect();
  if (e.touches.length === 2){
    pinch = {d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                          e.touches[0].clientY-e.touches[1].clientY), c:view.count};
    drag = null;
  } else {
    const px = e.touches[0].clientX - r.left, py = e.touches[0].clientY - r.top;
    if (lineMode){ toggleLevelAt(py); return; }
    const now = Date.now();
    if (now - lastTap < 300){          // double tap resets the zoom
      view.count = Math.min(160, Math.max(30, bars.length));
      view.right = 0; follow = true; clampView(); render(); savePrefs();
      lastTap = 0; drag = null; return;
    }
    lastTap = now;
    drag = {x:e.touches[0].clientX, right:view.right, t:now, vx:0};
    cross = barAt(px); crossY = py;
    statsForCursor(); render();
  }
}, {passive:true});

$('wrap').addEventListener('touchmove', e => {
  const r = cv.getBoundingClientRect();
  if (pinch && e.touches.length === 2){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                         e.touches[0].clientY-e.touches[1].clientY);
    if (d > 0){ view.count = pinch.c * (pinch.d/d); clampView(); render(); }
  } else if (drag && e.touches.length === 1){
    const cxp = e.touches[0].clientX;
    const dx = cxp - drag.x;
    const now = Date.now(), dt = Math.max(1, now - drag.t);
    drag.vx = (cxp - (drag.lastX == null ? cxp : drag.lastX)) / dt * 16;
    drag.lastX = cxp; drag.t = now;
    const bw = (W-PAD_R)/view.count;
    // Right-to-left page, left-to-right chart: dragging right walks back.
    view.right = drag.right + dx/bw;
    clampView();
    cross = barAt(cxp - r.left); crossY = e.touches[0].clientY - r.top;
    statsForCursor(); render();
  }
  e.preventDefault();
}, {passive:false});

$('wrap').addEventListener('touchend', () => {
  if (drag && Math.abs(drag.vx) > 0.5){ vel = drag.vx; startGlide(); }
  pinch = null; drag = null; savePrefs(); scheduleApprox();
}, {passive:true});

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  cross = barAt(e.clientX - r.left); crossY = e.clientY - r.top;
  statsForCursor(); render();
});
cv.addEventListener('mouseleave', () => { cross = null; crossY = null; statsForCursor(); render(); });
cv.addEventListener('click', e => {
  if (!lineMode) return;
  const r = cv.getBoundingClientRect();
  toggleLevelAt(e.clientY - r.top);
});
$('wrap').addEventListener('wheel', e => {
  view.count *= e.deltaY > 0 ? 1.12 : 0.89;
  clampView(); render(); savePrefs(); scheduleApprox(); e.preventDefault();
}, {passive:false});

// ─── Folding ────────────────────────────────────────────────────────────────
const bucket = t => Math.floor(t/tf.fold)*tf.fold;
function fold(raw){
  if (tf.fold === 1) return raw;
  const out = [];
  for (const r of raw){
    const t = bucket(r.time), last = out[out.length-1];
    if (last && last.time === t){
      last.high = Math.max(last.high, r.high);
      last.low  = Math.min(last.low,  r.low);
      last.close = r.close; last.volume += r.volume;
    } else out.push({time:t, open:r.open, high:r.high, low:r.low, close:r.close, volume:r.volume});
  }
  return out;
}

// ─── Data ───────────────────────────────────────────────────────────────────
async function fetchPage(host, endTime){
  let url = host+'/api/v3/klines?symbol='+symbol+'&interval='+tf.base+'&limit=1000';
  if (endTime) url += '&endTime='+endTime;
  const res = await fetch(url, {cache:'no-store'});
  if (!res.ok) throw new Error('HTTP '+res.status);
  return (await res.json()).map(a => ({
    time:Math.floor(a[0]/1000), open:+a[1], high:+a[2], low:+a[3], close:+a[4], volume:+a[5]
  }));
}
async function loadHistory(){
  // A second-based chart needs several pages to cover a useful stretch of time;
  // a minute-based one already gets sixteen hours from a single page.
  const pages = tf.base === '1s' ? 4 : 1;
  let err;
  for (let k=0;k<HOSTS.length;k++){
    const host = HOSTS[(hostIdx+k)%HOSTS.length];
    try{
      let raw = await fetchPage(host, null);
      for (let p=1; p<pages && raw.length; p++){
        const older = await fetchPage(host, raw[0].time*1000 - 1);
        if (!older.length) break;
        raw = older.concat(raw);
      }
      hostIdx = (hostIdx+k)%HOSTS.length;
      bars = fold(raw);
      // The newest folded bucket is partial and the stream cannot tell which of
      // its 1s candles history already counted, so it would rebuild the volume
      // far too low. Drop it and let the stream form it cleanly.
      if (tf.fold > 1) bars.pop();
      hideMsg();
      return true;
    } catch(e){ err = e; }
  }
  say('دیتا لود نشد',
      'هیچ‌کدام از سرورهای بایننس جواب ندادند. اگر از ایران وصل می‌شوی، فیلترشکن را روشن کن.'+
      '<br><br>' + (err ? err.message : ''));
  state('قطع','bad');
  return false;
}
function connect(){
  if (ws){ try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; }
  clearTimeout(reconnect);
  state('در حال اتصال…');
  try{ ws = new WebSocket(WS_HOSTS[wsIdx%WS_HOSTS.length]+'/'+symbol.toLowerCase()+'@kline_'+tf.base); }
  catch(e){ retry(); return; }
  ws.onopen  = () => state('زنده','live');
  ws.onerror = () => state('خطای اتصال','bad');
  ws.onclose = () => { state('قطع — تلاش دوباره','bad'); retry(); };
  ws.onmessage = ev => {
    let k; try{ k = JSON.parse(ev.data).k; }catch(e){ return; }
    if (!k) return;
    const r = {time:Math.floor(k.t/1000), open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v};
    const t = bucket(r.time), last = bars[bars.length-1];

    if (last && last.time === t && (tf.fold === 1 || last._s)){
      if (tf.fold === 1){
        // Binance reports an open candle's volume cumulatively: replace, not add.
        last.high = r.high; last.low = r.low; last.close = r.close; last.volume = r.volume;
      } else {
        last.high = Math.max(last.high, r.high);
        last.low  = Math.min(last.low,  r.low);
        last.close = r.close;
        last._s[r.time] = r.volume;
        let s = 0; for (const v of Object.values(last._s)) s += v;
        last.volume = s;
      }
    } else {
      if (last) delete last._s;
      bars.push({time:t, open:r.open, high:r.high, low:r.low, close:r.close,
                 volume:r.volume, _s:{[r.time]:r.volume}});
      if (bars.length > 2000) bars.shift();
      if (!follow) view.right++;        // keep the viewport still while panned back
    }
    if (follow) view.right = 0;
    statsForCursor();
    render();
  };
}
function retry(){ wsIdx++; clearTimeout(reconnect); reconnect = setTimeout(connect, 2500); }

// m === true means the buyer sat on the book, so the trade was an aggressive
// SELL. That flag is the whole reason this is measurement and not inference.
function addTrade(price, qty, ms, isSell){
  const b = tradeBucket(Math.floor(ms/1000));
  let e = flow.get(b);
  if (!e){
    e = {buy:0, sell:0, lv:new Map()};
    flow.set(b, e);
    while (flow.size > 400) flow.delete(flow.keys().next().value);
  }
  if (isSell) e.sell += qty; else e.buy += qty;
  const L = Math.floor(price/lvlTick)*lvlTick;
  let c = e.lv.get(L);
  if (!c){ c = {b:0, s:0}; e.lv.set(L, c); }
  if (isSell) c.s += qty; else c.b += qty;
}
function connectTrades(){
  if (tws){ try{ tws.onclose = null; tws.close(); }catch(e){} tws = null; }
  clearTimeout(twsTimer);
  try{ tws = new WebSocket(WS_HOSTS[wsIdx%WS_HOSTS.length]+'/'+symbol.toLowerCase()+'@aggTrade'); }
  catch(e){ twsTimer = setTimeout(connectTrades, 3000); return; }
  tws.onclose = () => { twsTimer = setTimeout(connectTrades, 3000); };
  tws.onmessage = ev => {
    let t; try{ t = JSON.parse(ev.data); }catch(e){ return; }
    if (!t || t.p == null) return;
    addTrade(+t.p, +t.q, t.T, t.m === true);
  };
}
// One batch of recent trades so the newest bars have flow immediately; older
// bars fill in as the stream runs. Binance only serves the last 1000 this way.
async function fillApprox(){
  if (!fpOn || approxBusy || !bars.length) return;
  const {start, end} = visible();
  const key = symbol+'|'+tf.id+'|'+bars[start].time+'|'+bars[end-1].time;
  if (key === approxKey) return;
  approxBusy = true;
  try{
    const step = barSeconds();
    const fromMs = bars[start].time*1000;
    const toMs   = (bars[end-1].time + step)*1000;
    const host = HOSTS[hostIdx];
    const m = new Map();
    let cursor = fromMs, pages = 0;
    while (cursor < toMs && pages < 14){
      const res = await fetch(host+'/api/v3/klines?symbol='+symbol+'&interval=1s&limit=1000'+
                              '&startTime='+cursor+'&endTime='+toMs, {cache:'no-store'});
      if (!res.ok) break;
      const arr = await res.json();
      if (!arr.length) break;
      for (const a of arr){
        const sec = Math.floor(a[0]/1000), b = tradeBucket(sec);
        const close = +a[4], open = +a[1], vol = +a[5];
        if (!vol) continue;
        let e = m.get(b);
        if (!e){ e = {buy:0, sell:0, lv:new Map()}; m.set(b, e); }
        const sell = close < open;
        if (sell) e.sell += vol; else e.buy += vol;
        const L = Math.floor(close/lvlTick)*lvlTick;
        let c = e.lv.get(L);
        if (!c){ c = {b:0, s:0}; e.lv.set(L, c); }
        if (sell) c.s += vol; else c.b += vol;
      }
      cursor = arr[arr.length-1][0] + 1000;
      pages++;
      if (pages % 3 === 0) { approx = m; render(); }
    }
    approx = m;
    approxKey = key;
    render();
  } catch(e){ /* the chart stands without it */ }
  approxBusy = false;
}

async function seedTrades(pages){
  const host = HOSTS[hostIdx];
  try{
    const res = await fetch(host+'/api/v3/aggTrades?symbol='+symbol+'&limit=1000', {cache:'no-store'});
    if (!res.ok) return;
    let batch = await res.json();
    for (const t of batch) addTrade(+t.p, +t.q, t.T, t.m === true);
    // Walk backwards by aggregate-trade id; each page is another thousand
    // trades of history for the footprint.
    for (let p=1; p<pages && batch.length; p++){
      const firstId = batch[0].a;
      const from = firstId - 1000;
      if (from < 0) break;
      const r2 = await fetch(host+'/api/v3/aggTrades?symbol='+symbol+'&fromId='+from+'&limit=1000',
                             {cache:'no-store'});
      if (!r2.ok) break;
      batch = await r2.json();
      if (!batch.length) break;
      for (const t of batch) addTrade(+t.p, +t.q, t.T, t.m === true);
      if (p % 2 === 0) render();
    }
  } catch(e){ /* flow is an enhancement; the chart stands without it */ }
}

async function reload(){
  state('بارگذاری…');
  if (await loadHistory()){
    view.right = 0; follow = true; cross = null;
    view.count = Math.min(Math.max(6, view.count || 120), Math.max(6, bars.length));
    flow = new Map();
    lvlTick = niceStep((bars[bars.length-1]?.close || 1) * 0.00004);
    resize();
    showStats(bars.length-1);
    connect();
    connectTrades();
    approx = new Map(); approxKey = '';
    fillApprox();
    await seedTrades(tf.base === '1s' ? 6 : 12);
    render();
  }
}

// ─── UI ─────────────────────────────────────────────────────────────────────
loadPrefs();
loadLevels();
$('sym').value = symbol;
$('hotBtn').className = highlight ? 'on' : '';
$('dBtn').className   = deltaOn   ? 'on' : '';
$('fpBtn').className  = fpOn      ? 'on' : '';
$('absBtn').className = absOn     ? 'on' : '';

TFS.forEach(t => {
  const b = document.createElement('button');
  b.textContent = t.label;
  if (t.id === tf.id) b.className = 'on';
  b.onclick = () => {
    tf = t;
    [...$('tfs').children].forEach(c => c.className='');
    b.className = 'on';
    $('tfNote').textContent = t.fold > 1 ? 'ساخته‌شده از کندل ۱ ثانیه‌ای' : '';
    savePrefs();
    reload();
  };
  $('tfs').appendChild(b);
});
$('tfNote').textContent = tf.fold > 1 ? 'ساخته‌شده از کندل ۱ ثانیه‌ای' : '';

$('sym').onchange = e => { symbol = e.target.value; loadLevels(); savePrefs(); reload(); };
$('hotBtn').onclick = () => { highlight = !highlight;
  $('hotBtn').className = highlight ? 'on' : ''; savePrefs(); render(); };
$('dBtn').onclick = () => { deltaOn = !deltaOn;
  $('dBtn').className = deltaOn ? 'on' : ''; savePrefs(); render(); };
$('fpBtn').onclick = () => { fpOn = !fpOn;
  $('fpBtn').className = fpOn ? 'on' : ''; savePrefs(); render();
  if (fpOn) fillApprox(); };
$('absBtn').onclick = () => { absOn = !absOn;
  $('absBtn').className = absOn ? 'on' : ''; savePrefs(); render(); };
$('lineBtn').onclick = () => { lineMode = !lineMode;
  $('lineBtn').className = lineMode ? 'on' : '';
  $('lineBtn').textContent = lineMode ? 'خط ✓' : 'خط'; };
$('homeBtn').onclick = () => { stopGlide(); view.right = 0; follow = true;
  cross = null; crossY = null; statsForCursor(); render(); savePrefs(); };

// A 1s socket on a phone in a pocket is wasted battery and data.
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (ws){ try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; }
    if (tws){ try{ tws.onclose=null; tws.close(); }catch(e){} tws=null; }
    clearTimeout(twsTimer);
    state('متوقف');
  }
  else reload();
});

resize();
reload();
</script>
