name: session report

# After the New York close. The close moves an hour when the United States
# changes its clocks and Iran does not, so the schedule is set an hour later
# than the earliest possible close and the script works out the real session
# boundaries itself.
# Cancelled by him on 2026-09-14. The schedule is commented out rather than the
# file deleted: nothing here is broken code, the instrument underneath it was
# wrong, and the day of work in it should not have to be rewritten if he ever
# wants it back. Uncomment the two lines to start the nightly send again.
on:
  # schedule:
  #   - cron: '15 22 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: 'فقط یک نماد (مثلاً GC=F) — خالی یعنی همه'
        type: string
        default: ''

concurrency:
  group: session-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -q -r bot/requirements.txt
      - name: build and send
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          REPORT_CHAT_ID: ${{ secrets.REPORT_CHAT_ID }}
          ONLY: ${{ inputs.only }}
        run: python report/build.py
